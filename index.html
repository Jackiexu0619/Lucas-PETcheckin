<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#162235;--muted:#657287;--accent:#2d67d9;--line:#dbe3ef;--good:#137a4e;--warn:#a86400;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:#132238;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:20px}.sub{font-size:12px;color:#c8d3e4;margin-top:4px}nav{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{border:0;border-radius:9px;padding:9px 11px;background:#e8eef7;color:#172236;cursor:pointer;text-decoration:none;display:inline-block;font-size:13px}
button.primary,.btn.primary{background:var(--accent);color:#fff}.wrap{max-width:1180px;margin:auto;padding:18px}.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h3{margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.small{font-size:12px;color:var(--muted)}.big{font-size:25px;font-weight:750}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#edf2fb;font-size:12px;margin:2px}.tag.good{background:#e8f7ef;color:var(--good)}.tag.warn{background:#fff3dd;color:var(--warn)}.tag.bad{background:#ffedeb;color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.notice{padding:10px 12px;border:1px solid #d6e4f7;background:#eff6ff;border-radius:10px;font-size:13px}
.qbox{font-size:18px;line-height:1.62;margin:14px 0}.en-main{font-weight:650}.zh-sub{font-size:14px;color:#445269;line-height:1.65;margin-top:8px;padding-top:7px;border-top:1px dashed #dbe3ef}.zh-sub b{color:#1d4f91}.translation-missing{color:#8a5a00;background:#fff9e8;border:1px solid #ead7a3;border-radius:8px;padding:7px 9px;margin-top:8px}
.choices{display:grid;gap:8px}.choice{background:#fff;border:1px solid var(--line);text-align:left;padding:12px}.choice.sel{outline:2px solid var(--accent);background:#f4f7ff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#f8fafc;color:#526074}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}input[type=number]{width:90px}
.bar{height:8px;background:#e7edf5;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}@media(max-width:850px){.two{grid-template-columns:1fr}}
.kpi{display:flex;justify-content:space-between;gap:8px;align-items:flex-end}.kpi .v{font-size:24px;font-weight:750}.goodtxt{color:var(--good)}.badtxt{color:var(--bad)}
@media print{header,.no-print{display:none!important}.view{display:none!important}.view.printing{display:block!important}.wrap{max-width:none}.card{box-shadow:none}}

.print-root{display:none}
.paper-tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.paper-note{font-size:12px;color:var(--muted)}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body *{visibility:hidden!important}
  #printRoot,#printRoot *{visibility:visible!important}
  #printRoot{display:block!important;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff}
  .print-title{text-align:center;font-size:18pt;font-weight:700;margin-bottom:5mm}
  .print-sub{text-align:center;font-size:9.5pt;margin-bottom:6mm;color:#333}
  .print-meta{font-size:10pt;margin-bottom:5mm}
  .print-q{break-inside:avoid;margin:0 0 7mm 0;font-size:11pt;line-height:1.55}
  .print-q .en{font-weight:600;font-size:11.3pt}
  .print-q .zh{font-size:8.5pt;color:#555;margin-top:1.5mm}
  .print-q .zh-sub{font-size:9pt!important;color:#444!important;line-height:1.5!important;margin-top:1.5mm!important;padding-top:1mm!important;border-top:0.3pt dashed #bbb!important}
  .print-choices{font-size:9.5pt;margin-top:2mm;line-height:1.7}
  .work-lines{margin-top:3mm}
  .work-line{height:7mm;border-bottom:0.3pt solid #bbb}
  .print-page-break{break-before:page;page-break-before:always}
  .answer-row{font-size:10pt;line-height:1.8;break-inside:avoid}
  .print-footer{margin-top:5mm;font-size:8pt;color:#666}
}


.timerbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:11px;background:#f7f9fd;border:1px solid var(--line);margin:12px 0}
.timerdisplay{font-variant-numeric:tabular-nums;font-size:24px;font-weight:750;letter-spacing:.5px}
.timerstatus{font-size:12px;color:var(--muted)}
.speed-good{color:var(--good)}.speed-warn{color:var(--warn)}.speed-bad{color:var(--bad)}


.figbox{margin:10px 0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;display:flex;justify-content:center}
.figbox svg{width:min(300px,100%);max-width:100%;height:auto}
.mockrec-table select,.mockrec-table input{padding:4px 6px;font-size:12px}
.mock-summary{padding:10px 12px;border:1px solid #e4d5a7;background:#fff9e8;border-radius:10px}


.entry-grid{display:grid;grid-template-columns:44px minmax(180px,1fr) 110px 110px 88px;gap:8px;align-items:center}
.entry-grid.header{font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px}
.entry-grid.rowitem{padding:8px 0;border-bottom:1px solid var(--line)}
@media(max-width:760px){.entry-grid{grid-template-columns:36px 1fr 95px 90px}.entry-grid .guesscol{display:none}}

.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:900px){.quick-grid{grid-template-columns:repeat(3,1fr)}}
.mock-card{border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.mock-card .qnum{font-weight:750;font-size:15px;margin-bottom:6px}
.choice-row{display:flex;gap:4px;flex-wrap:wrap}
.quick-choice{padding:6px 8px;min-width:32px;border:1px solid var(--line);background:#f7f9fc;border-radius:7px;font-size:12px}
.quick-choice.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.quick-choice.unable.active{background:#a86400;border-color:#a86400}
.quick-choice.skip.active{background:#657287;border-color:#657287}
.batchbox{width:100%;min-height:66px}
.progress-pill{display:inline-block;background:#edf2fb;border-radius:999px;padding:4px 9px;font-size:12px}
.figure-note{font-size:11px;color:var(--muted);text-align:center;margin-top:4px}


.exam-id{display:inline-block;padding:5px 9px;background:#132238;color:#fff;border-radius:8px;font-size:12px;font-weight:700}
.exam-panel{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff}
.exam-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.exam-buttons{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.exam-btn{padding:8px 10px;border:1px solid var(--line);background:#f8fafc;border-radius:8px}
.exam-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.exam-btn.unable.active{background:#a86400;border-color:#a86400}
.exam-btn.skip.active{background:#657287;border-color:#657287}
.paper-lock{border:1px solid #cbd8eb;background:#f4f8ff;border-radius:10px;padding:10px 12px}
.preview-q{padding:12px 0;border-bottom:1px solid var(--line)}
.preview-q:last-child{border-bottom:0}


@media print{

  .figbox{
    width:56mm!important;
    max-width:56mm!important;
    margin:2mm auto 2.5mm!important;
    padding:1.5mm!important;

    max-height:38mm!important;

  }

    margin-top:0.5mm!important;

  }
  .print-q{
    margin-bottom:5mm!important;
  }

  .daily-print .figbox{width:42mm!important;max-width:42mm!important;margin:.8mm auto 1mm!important;padding:.5mm!important}

}

de","figure_data":{"leg_a":9,"leg_b":12}},{"id":"q059","domain":"geometry","skill":"trapezoid_area","core_method":"trapezoid_area","difficulty":1,"prompt":"一个梯形的两条底边分别长8和14，高为6。这个梯形的面积是多少？","prompt_en":"A trapezoid has bases of lengths 8 and 14 and height 6. What is its area?","prompt_zh":"一个梯形的两条底边分别是8和14，高为6。求面积。","choices":["54","66","60","72","84"],"answer":"B","hints":["梯形面积=(上底+下底)×高÷2。"],"hints_en":["Use one-half times the sum of the bases times the height."],"hints_zh":["梯形面积=(上底+下底)×高÷2。"],"trap_tags":["forgot_half","used_slanted_side"],"source":"original","figure_type":"trapezoid","figure_data":{"top":8,"bottom":14,"height":6}},{"id":"q060","domain":"geometry","skill":"rectangle_midpoint","core_method":"base_height_area","difficulty":2,"prompt":"长方形ABCD中，AB=12，BC=8。点E是BC的中点。三角形AED的面积是多少？","prompt_en":"Rectangle ABCD has AB=12 and BC=8. Point E is the midpoint of BC. What is the area of triangle AED?","prompt_zh":"长方形ABCD中，AB=12，BC=8，E是BC的中点。求三角形AED的面积。","choices":["24","48","32","40","64"],"answer":"B","hints":["把AD看作底，E到AD的距离就是长方形的宽。"],"hints_en":["Use AD as the base. The perpendicular distance from E to AD equals AB."],"hints_zh":["以AD为底，E到AD的垂直距离等于AB。"],"trap_tags":["midpoint_distractor","wrong_height"],"source":"original","figure_type":"rectangle_midpoint","figure_data":{"w":12,"h":8}},{"id":"q061","domain":"geometry","skill":"square_point_area","core_method":"base_height_area","difficulty":2,"prompt":"正方形ABCD边长为10。点E在BC上，且BE=6。三角形AED的面积是多少？","prompt_en":"Square ABCD has side length 10. Point E lies on BC and BE=6. What is the area of triangle AED?","prompt_zh":"正方形ABCD边长10，E在BC上且BE=6。求三角形AED的面积。","choices":["30","40","48","50","60"],"answer":"D","hints":["以AD为底，E到AD的高始终等于正方形边长。"],"hints_en":["Use AD as the base. The height from E to AD is always the side length of the square."],"hints_zh":["以AD为底，E到AD的高始终是10。"],"trap_tags":["irrelevant_segment","wrong_height"],"source":"original","figure_type":"square_point","figure_data":{"side":10,"be":6}},{"id":"q0 function generateDailyPlan(){
  const pool=eligibleDailyBank();
  if(pool.length<3)return [];
  const used=[];
  const weakMap=recentWeakSuperDomains();
  const weakDomain=Object.entries(weakMap).sort((a,b)=>b[1]-a[1])[0]?.[0];

  // Slot 1: 近期弱项迁移。默认瞄准 Q15–18，不再从Q9/10这类低段开始。
  let aPool=pool.filter(q=>q.problem_number>=13&&q.problem_number<=19);
  if(weakDomain&&weakMap[weakDomain]>0){
    const w=aPool.filter(q=>superDomain(q)===weakDomain);if(w.length)aPool=w;
  }
  let a=aPool.sort((x,y)=>authenticScore(y,16,used,'weak')-authenticScore(x,16,used,'weak'))[0]||pool[0];
  used.push(a);

  // Slot 2: 到期/历史复测。默认瞄准 Q16–20；同领域不强制重复。
  let dueCandidates=pool.filter(q=>q.problem_number>=14&&q.problem_number<=21&&!used.some(x=>x.id===q.id)&&S.skill_state?.[skillKey(q)]?.next_review<=today());
  let bPool=dueCandidates.length?dueCandidates:pool.filter(q=>q.problem_number>=14&&q.problem_number<=21&&!used.some(x=>x.id===q.id)&&superDomain(q)!==superDomain(a));
  let b=bPool.sort((x,y)=>authenticScore(y,17,used,'due')-authenticScore(x,17,used,'due'))[0];
  if(b)used.push(b);

  // Slot 3: 广度/陌生题。平日以Q19–22为中心；周五向Q22–25推进。
  const dow=new Date().getDay(),targetPos=dow===5?23:20;
  let cPool=pool.filter(q=>!used.some(x=>x.id===q.id)&&q.problem_number>=17&&!used.some(x=>superDomain(x)===superDomain(q)));
  if(dow===5){const hard=cPool.filter(q=>q.problem_number>=22);if(hard.length)cPool=hard;}
  else {const midhard=cPool.filter(q=>q.problem_number>=18&&q.problem_number<=22);if(midhard.length)cPool=midhard;}
  let c=cPool.sort((x,y)=>authenticScore(y,targetPos,used,'coverage')-authenticScore(x,targetPos,used,'coverage'))[0];
  if(c)used.push(c);
  return used.slice(0,3);
}

function updateSkill(q,r){

    if(['knowledge_gap','method_gap'].includes(r.error_type)){m=Math.max(.05,m-.16);gap=1}

function mockTopic(q){return MOCK_TOPIC_MAP[q.domain]||'patterns_logic'}
function mockTopicCounts(qs){const c={application:0,geometry:0,counting_probability:0,number_theory:0,patterns_logic:0,data:0};for(const q of qs)c[mockTopic(q)]=(c[mockTopic(q)]||0)+1;return c}
function mockProfileText(profile){return Object.entries(profile).map(([k,v])=>`${MOCK_TOPIC_LABEL[k]} ${v}`).join(' · ')}
function validateMockSelection(chosen,profile){
  const errors=[];
  if(chosen.length!==25)errors.push(`题数${chosen.length}`);
  chosen.forEach((q,i)=>{if(q.difficulty!==EXAM_DIFFICULTY_BY_POSITION[i])errors.push(`Q${i+1}难度${q.difficulty}≠${EXAM_DIFFICULTY_BY_POSITION[i]}`)});
  const methods={},families={};
  for(const q of chosen){methods[q.core_method]=(methods[q.core_method]||0)+1;families[familyKey(q)]=(families[familyKey(q)]||0)+1}
  if(Object.values(methods).some(v=>v>2))errors.push('核心方法>2');
  if(Object.values(families).some(v=>v>1))errors.push('同模型兄弟题>1');
  for(let i=2;i<chosen.length;i++)if(chosen[i].domain===chosen[i-1].domain&&chosen[i].domain===chosen[i-2].domain)errors.push(`Q${i-1}-${i+1}连续同领域`);
  const tc=mockTopicCounts(chosen);
  for(const [k,v] of Object.entries(profile))if(tc[k]!==v)errors.push(`${k}:${tc[k]}≠${v}`);
  const lateDomains=new Set(chosen.slice(20).map(q=>q.domain));

function mockCandidateScore(q,i,profile,topicCount,domainCount,chosen){
  const topic=mockTopic(q),need=(profile[topic]||0)-(topicCount[topic]||0);
  let s=Math.random()*.8+need*1.25;
  s-=(methodFreq()[q.core_method]||0)*.18;
  s-=(domainCount[q.domain]||0)*.10;
  if(chosen.length&&chosen.at(-1).domain===q.domain)s-=.45;
  // 仅7个位置（28%）加入个性化弱项权重；其余位置优先保持正式卷结构和广度。
  if(MOCK_PERSONALIZED_POSITIONS.has(i))s+=(1-mastery(q))*2.4+Math.max(0,recentWeakAffinity(q))*.35;
  // 后五题主动鼓励跨领域，确保Q21-25不是一串同类难题。
  if(i>=20&&!new Set(chosen.slice(20).map(x=>x.domain)).has(q.domain))s+=1.5;
  return s;
}
const MOCK_TOPICS=['application','geometry','counting_probability','number_theory','patterns_logic','data'];
function shuffleCopy(arr){
  const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;
}
function topicCompositions(total,caps,remaining){
  const out=[],cur={};
  function rec(i,left){
    if(i===MOCK_TOPICS.length){if(left===0)out.push({...cur});return}
    const t=MOCK_TOPICS[i],mx=Math.min(caps[t]||0,remaining[t]||0,left);
    for(let v=0;v<=mx;v++){cur[t]=v;rec(i+1,left-v)}
  }
  rec(0,total);return shuffleCopy(out);
}
function bandPlanPenalty(d,co){
  const pref=MOCK_BAND_PREF[d]||{};
  let c=0;for(const t of MOCK_TOPICS)c+=Math.abs((co[t]||0)-(pref[t]||0));return c;
}
function findMockTopicPlan(profile,blocked){
  const groups=[[1,8],[2,8],[3,5],[4,4]],caps={};
  for(const [d] of groups){
    caps[d]={};
    for(const t of MOCK_TOPICS){
      const fs=new Set(BANK.filter(q=>q.difficulty===d&&!blocked.has(q.id)&&mockTopic(q)===t).map(familyKey));
      caps[d][t]=fs.size;
    }
  }
  const memo=new Map();
  function solve(g,remaining){
    const key=`${g}|${MOCK_TOPICS.map(t=>remaining[t]||0).join(',')}`;
    if(memo.has(key))return memo.get(key);
    if(g===groups.length){
      const ok=MOCK_TOPICS.every(t=>(remaining[t]||0)===0),res=ok?{cost:0,plan:{}}:null;memo.set(key,res);return res;
    }
    const [d,n]=groups[g];
    const comps=topicCompositions(n,caps[d],remaining).sort((a,b)=>bandPlanPenalty(d,a)-bandPlanPenalty(d,b));
    let best=null;
    for(const co of comps){
      const next={...remaining};for(const t of MOCK_TOPICS)next[t]-=co[t]||0;
      const sub=solve(g+1,next);if(!sub)continue;
      const cost=bandPlanPenalty(d,co)+sub.cost;
      if(!best||cost<best.cost)best={cost,plan:{[d]:{...co},...sub.plan}};
      if(best?.cost===0)break;
    }
    memo.set(key,best);return best;
  }
  return solve(0,{...profile})?.plan||null;
}
function buildPrintableMockCore(){
  const recentMocks=recentWeekendQuestionIds(4),recentWeekdays=recentWeekdayQuestionIds(7);
  const blocked=new Set([...recentMocks,...recentWeekdays]);
  let bestFailure='';
  const candidatePlans=[];
  for(const profile of shuffleCopy(MOCK_TOPIC_PROFILES)){
    const plan=findMockTopicPlan(profile,blocked);
    if(plan)candidatePlans.push({profile,plan});
  }
  if(!candidatePlans.length){
    alert('当前防重复范围下，题型配额与难度骨架已经没有可行组合。系统没有偷偷放宽规则。');return;
  }

  for(let attempt=0;attempt<500;attempt++){
    const {profile,plan}=candidatePlans[attempt%candidatePlans.length];
    const chosen=[],methodCount={},familyCount={},domainCount={},topicTotalCount={};
    const diffTopicCount={1:{},2:{},3:{},4:{}};
    let failed=false;

    for(let i=0;i<25;i++){
      const d=EXAM_DIFFICULTY_BY_POSITION[i];
      let pool=BANK.filter(q=>{
        const topic=mockTopic(q),usedInBand=diffTopicCount[d][topic]||0,targetInBand=plan[d]?.[topic]||0;
        if(q.difficulty!==d||blocked.has(q.id)||chosen.some(x=>x.id===q.id))return false;
        if((methodCount[q.core_method]||0)>=2)return false;
        if((familyCount[familyKey(q)]||0)>=1)return false;
        if(usedInBand>=targetInBand)return false;
        if(chosen.length>=2&&chosen.at(-1).domain===q.domain&&chosen.at(-2).domain===q.domain)return false;
        return true;
      });

      if(i>=22){
        const lateDomains=new Set(chosen.slice(20).map(q=>q.domain)),remain=25-i;
        if(lateDomains.size<3&&3-lateDomains.size>=remain){
          const fresh=pool.filter(q=>!lateDomains.has(q.domain));if(fresh.length)pool=fresh;
        }
      }
      if(!pool.length){failed=true;bestFailure=`第${i+1}题候选池为空`;break}

      const scored=pool.map(q=>{
        const topic=mockTopic(q),bandNeed=(plan[d]?.[topic]||0)-(diffTopicCount[d][topic]||0);
        return [q,mockCandidateScore(q,i,profile,topicTotalCount,domainCount,chosen)+bandNeed*1.8];
      }).sort((a,b)=>b[1]-a[1]);
      const top=scored.slice(0,Math.min(4,scored.length));
      const q=top[Math.floor(Math.random()*top.length)][0],topic=mockTopic(q);
      chosen.push(q);
      methodCount[q.core_method]=(methodCount[q.core_method]||0)+1;
      familyCount[familyKey(q)]=(familyCount[familyKey(q)]||0)+1;
      domainCount[q.domain]=(domainCount[q.domain]||0)+1;
      diffTopicCount[d][topic]=(diffTopicCount[d][topic]||0)+1;
      topicTotalCount[topic]=(topicTotalCount[topic]||0)+1;
    }
    if(failed)continue;
    const check=validateMockSelection(chosen,profile);
    if(!check.ok){bestFailure=check.errors.join('；');continue}

    S.printable_mock_ids=chosen.map(q=>q.id);
    S.printable_mock_date=today();
    S.printable_mock_meta={
      engine:'exam_assembly_v062',engine_version:ENGINE_VERSION,
      topic_profile:{...profile},topic_counts:check.topic_counts,topic_plan_by_difficulty:plan,
      difficulty_by_position:[...EXAM_DIFFICULTY_BY_POSITION],
      difficulty_sections:['Q1-5','Q6-10','Q11-15','Q16-20','Q21-23','Q24-25'],
      personalized_positions:[...MOCK_PERSONALIZED_POSITIONS].map(x=>x+1),personalized_ratio:7/25,
      late_domains:check.late_domains,
      constraints:{last_4_mocks_excluded:true,last_7_weekdays_excluded:true,same_method_max:2,same_family_max:1,no_three_consecutive_same_domain:true,q21_25_min_domains:3}
    };
    saveStateLocal();renderAll();return;
  }
  alert(`在当前题库与防重复规则下，尝试500次仍无法组成满足全部结构约束的25题。最后原因：${bestFailure||'未知'}。系统没有偷偷放宽规则。`);
}

function figureHtml(q){

  if(q.figure_type==='right_triangle')return `<div class=figbox>${svgRightTriangle(d)}</div>`;
  if(q.figure_type==='similar_triangles')return `<div class=figbox>${svgSimilarTriangles(d)}</div>`;

  if(q.figure_type==='coordinate')return `<div class=figbox>${svgCoordinate(d.x,d.y)}</div><div class=figure-note>Diagram not necessarily to scale / 示意图不一定按比例</div>`;
  if(q.figure_type==='triangle_ratio')return `<div class=figbox>${svgTriangle(d.r1,d.r2)}</div><div class=figure-note>示意图</div>`;
  if(q.figure_type==='prism')return `<div class=figbox>${svgPrism(d.a,d.b,d.c)}</div><div class=figure-note>示意图</div>`;
  if(q.figure_type==='rectangle_cutout')return `<div class=figbox>${svgRectangleCutout(d)}</div>`;
  if(q.figure_type==='right_triangle_altitude')return `<div class=figbox>${svgRightTriangleAltitude(d)}</div>`;
  if(q.figure_type==='trapezoid')return `<div class=figbox>${svgTrapezoid(d)}</div>`;
  if(q.figure_type==='rectangle_midpoint')return `<div class=figbox>${svgRectangleMidpoint(d)}</div>`;
  if(q.figure_type==='square_point')return `<div class=figbox>${svgSquarePoint(d)}</div>`;
  if(q.figure_type==='sector')return `<div class=figbox>${svgSector(d)}</div>`;
  if(q.figure_type==='parallelogram')return `<div class=figbox>${svgParallelogram(d)}</div>`;
  if(q.figure_type==='triangle_angle_ratio')return `<div class=figbox>${svgTriangleAngleRatio(d)}</div>`;
  let pt=parsePoint(t); if(pt)return `<div class=figbox>${svgCoordinate(pt[0],pt[1])}</div>`;
  let tr=parseTriangleRatio(t); if(/Triangle ABC/i.test(t)&&tr)return `<div class=figbox>${svgTriangle(tr[0],tr[1])}</div>`;
  let dims=parsePrismDims(t); if(dims)return `<div class=figbox>${svgPrism(dims[0],dims[1],dims[2])}</div>`;
  return '';
}

function weekPaperBase(){
  const d=new Date((S.printable_mock_date||today())+'T12:00:00');
  const day=(d.getDay()+6)%7;
  d.setDate(d.getDate()-day+3);
  const first=new Date(d.getFullYear(),0,4);
  const firstDay=(first.getDay()+6)%7;
  first.setDate(first.getDate()-firstDay+3);
  const w=1+Math.round((d-first)/604800000);
  return `${d.getFullYear()}-W${String(w).padStart(2,'0')}`;
}
function allocatePaperId(){
  const base=weekPaperBase();
  const used=new Set([
    ...(S.mock_detail_history||[]).map(x=>x.paper_id).filter(Boolean),
    ...Object.keys(S.mock_drafts||{})
  ]);
  let n=1,id=`${base}-${String(n).padStart(2,'0')}`;
  while(used.has(id)){n++;id=`${base}-${String(n).padStart(2,'0')}`}
  return id;
}
function ensurePaperId(){
  if(!S.printable_mock_id){
    S.printable_mock_id=allocatePaperId();
    S.mock_drafts=S.mock_drafts||{};
    S.mock_drafts[S.printable_mock_id]={answers:{},guesses:{},total_minutes:null};
    saveStateLocal();
  }
  return S.printable_mock_id;
}
function currentDraft(){
  const id=ensurePaperId();
  S.mock_drafts=S.mock_drafts||{};

function applyMockBatch(){

  const toks=raw.split(/[\s,，;；]+/).filter(Boolean).map(x=>{

    if(['A','B','C','D','E'].includes(u))return u;
    if(['N','不会','不会做','不会的'].includes(x)||u==='N')return 'N';

    return '?';
  });

  if(toks.includes('?')){alert('有无法识别的内容。请只用 A-E、不会/N、未做/X。');return}
  toks.forEach((v,i)=>setMockChoice(i,v));

function submitPrintableMockAnswers(){
  const qs=printableMock();if(qs.length!==25){alert('请先生成本周25题');return}
  const d=currentDraft(),per=[];
  let score=0,indep=0,attempted=0,wrong=[],unable=[],skipped=[],guessedQs=[];
  for(let i=0;i<25;i++){
    const q=qs[i],ans=d.answers?.[String(i)]||'',guessed=!!d.guesses?.[String(i)];
    if(!ans){mockEntryIndex=i;renderMockQuestion();alert(`第${i+1}题还没有录入。`);return}
    const isUnable=ans==='N',isSkipped=ans==='X',answered=!isUnable&&!isSkipped;
    const correct=answered&&ans===q.answer;
    if(answered)attempted++;
    if(correct)score++;
    if(correct&&!guessed)indep++;
    if(isUnable)unable.push(i+1);else if(isSkipped)skipped.push(i+1);else if(!correct)wrong.push(i+1);
    if(answered&&guessed)guessedQs.push(i+1);
    per.push({qid:q.id,index:i+1,selected_answer:answered?ans:null,result_status:isUnable?'unable':isSkipped?'skipped':correct?'correct':'wrong',correct,guessed:answered?guessed:false,attempted:answered,answer:q.answer});
    const rec={question_id:q.id,date:S.printable_mock_date||today(),correct,selected_answer:answered?ans:null,result_status:isUnable?'unable':isSkipped?'skipped':correct?'correct':'wrong',duration_sec:null,guessed:answered?guessed:false,hint_level:0,error_type:isUnable?'method_gap':isSkipped?'time_issue':null,error_detail:isUnable?'unable':isSkipped?'not_attempted':null,independent:correct&&!guessed,source:'weekend_mock',speed_label:null,paper_id:ensurePaperId(),paper_question_index:i+1};
    S.attempts=S.attempts||[];S.attempts.push(rec);updateSkill(q,rec);
  }

function submitDailyPaperResults(){
  const plan=dailyPlan();
  if(S.daily_plan?.date===today()&&S.daily_plan.submitted){alert(`今日3题已经提交过。\n卷号：${dailyPaperId()}\n如需更正，请先使用“撤销今日提交”。`);return}
  let correctCount=0,totalSec=0,wrong=[],unable=[],skipped=[];
  for(let i=0;i<plan.length;i++){
    const q=plan[i];
    const ans=(document.getElementById(`daily_ans_${i}`)?.value||'');
    const secRaw=(document.getElementById(`daily_sec_${i}`)?.value||'').trim();
    const guessed=document.getElementById(`daily_guess_${i}`)?.checked||false;
    if(!ans){alert(`第${i+1}题还没有录答案。`);return}
    let sec=null;
    if(secRaw!==''){
      sec=+secRaw;
      if(!Number.isFinite(sec)||sec<0){alert(`第${i+1}题用时不正确。`);return}
      totalSec+=sec;
    }
    const isUnable=ans==='N', isSkipped=ans==='X', answered=!isUnable&&!isSkipped;
    const correct=answered && ans===q.answer;
    if(correct)correctCount++;
    if(isUnable)unable.push(i+1); else if(isSkipped)skipped.push(i+1); else if(!correct)wrong.push(i+1);

    let et=null,ed=null;
    if(isUnable){et='method_gap';ed='unable'}
    else if(isSkipped){et='time_issue';ed='not_attempted'}
    else if(!correct){
      et=(document.getElementById(`daily_err_${i}`)?.value||'method_gap');
      ed=et==='knowledge_gap'?(q.trap_tags?.[0]||'concept_unknown'):
         et==='method_gap'?'no_entry':
         et==='execution_error'?(q.trap_tags?.[0]||'execution'):'stuck';
    }else if(sec!==null && sec>(S.settings?.slow_threshold_sec||240)){
      et='time_issue';ed='correct_but_slow';
    }

    const rec={
      question_id:q.id,date:today(),correct,selected_answer:answered?ans:null,
      result_status:isUnable?'unable':isSkipped?'skipped':correct?'correct':'wrong',
      duration_sec:sec,guessed:answered?guessed:false,hint_level:0,error_type:et,error_detail:ed,
      independent:correct&&!guessed,source:'paper_daily',
      speed_label:sec!==null?speedLabel(sec,correct):null
    };
    S.attempts=S.attempts||[];S.attempts.push(rec);updateSkill(q,rec);
  }
  S.daily_sessions=S.daily_sessions||[];
  S.daily_sessions.push({
    date:today(),paper_id:dailyPaperId(),question_ids:plan.map(q=>q.id),question_count:plan.length,total_sec:totalSec||null,
    correct:correctCount,wrong_questions:wrong,unable_questions:unable,skipped_questions:skipped,source:'paper_daily'
  });
  if(S.daily_plan?.date===today()){S.daily_plan.submitted=true;S.daily_plan.submitted_at=new Date().toISOString()}
  saveStateLocal();
  alert(`今日3题已录入。\n正确：${correctCount}/3\n答错：${wrong.join(',')||'无'}\n不会：${unable.join(',')||'无'}\n未做：${skipped.join(',')||'无'}${totalSec?`\n总用时：${secFmt(totalSec)}`:''}`);
  renderAll();
}

function undoTodayDailySubmission(){

  const ids=new Set(p.question_ids||[]);
  S.attempts=(S.attempts||[]).filter(a=>!(a.date===today()&&a.source==='paper_daily'&&ids.has(a.question_id)));
  S.daily_sessions=(S.daily_sessions||[]).filter(x=>!(x.date===today()&&x.source==='paper_daily'&&x.paper_id===pid));
  // 重建受影响技能：从SEED基线开始，再重放保留下来的后续记录。

    const q=qById(id);if(!q)continue;const k=skillKey(q);

    }

}

function superDomain(q){
  const d=q?.domain;
  if(['geometry','coordinate','spatial'].includes(d))return 'geometry';
  if(['number_theory'].includes(d))return 'number_theory';
  if(['combinatorics','probability'].includes(d))return 'combinatorics';
  if(['arithmetic','ratio','rate','data','patterns','algebra'].includes(d))return 'algebra';
  return 'misc';
}
function familyKey(q){return q?.variant_group||[superDomain(q),q?.skill,q?.core_method].join('/')}
function bandDifficulty(n){return n<=8?1:n<=16?2:n<=21?3:4}
function labelVectorDomain(v){
  if(!Array.isArray(v))return 'misc';
  if(v[2])return 'geometry';
  if(v[3])return 'number_theory';
  if(v[4])return 'combinatorics';
  if(v[1])return 'algebra';
  return 'misc';
}
function parseLabelText(t){
  const out={};
  String(t||'').split(/\r?\n/).forEach(line=>{
    const m=line.match(/^(\d{4}) AMC 8 #(\d+):\s*\[([01,\s]+)\]/);
    if(!m)return;
    out[`${m[1]}-${Number(m[2])}`]=m[3].split(',').map(x=>+x.trim());
  });
  return out;
}
function makeRealQuestion(key,v,labelMap){
  const year=Number(v.test?.[0]),num=Number(v.number),diff=bandDifficulty(num);
  const domain=labelVectorDomain(labelMap[`${year}-${num}`]);
  return {
    id:`real_${year}_${String(num).padStart(2,'0')}`,
    domain,
    skill:`official_${domain}_band${diff}`,
    core_method:`official_${domain}_band${diff}`,
    difficulty:diff,
    problem_html:v.problem||'',
    prompt:officialPlain(v.problem||''),
    prompt_en:officialPlain(v.problem||''),
    prompt_zh:'',
    choices:Array.isArray(v.choices)?v.choices.map(x=>String(x).trim()):[],
    answer:String(v.answer||'').trim().toUpperCase(),
    hints:[],
    trap_tags:['official_amc8'],
    source:`${year} AMC8`,
    official:true,
    active:true,
    year,problem_number:num,
    quality_tier:'official',
    variant_group:`official_position_${num}`,
    amc_band:{1:'Q1-8',2:'Q9-16',3:'Q17-21',4:'Q22-25'}[diff]
  };
}

function eligibleDailyBank(){
  // v0.6.3 日常训练不再从旧300道简单生成题出题。
  // Lucas 当前专项基线：默认只用真实 AMC8 Q13–Q25。Q1–12 留给周末完整模拟或人工指定，避免日常专项过易。
  return REAL_BANK.filter(q=>q.problem_number>=13&&questionEligibleForDaily(q));
}
function targetDifficulty(q){
  const hist=skillAttempts(q);
  if(!hist.length)return 2; // Lucas 当前基线：新技能从AMC8 Q9–16起步，不从三年级式基础题起步
  const last=hist[hist.length-1],a=last.a,d=last.q?.difficulty||q.difficulty||2;
  if(a.result_status==='unable'||a.error_detail==='unable'||!a.correct){
    if(['knowledge_gap','method_gap'].includes(a.error_type)||a.result_status==='unable')return Math.max(2,d-1);
    return Math.max(2,d);
  }
  if(a.guessed)return Math.max(2,d);
  let streak=0;
  for(let i=hist.length-1;i>=0;i--){
    const x=hist[i].a;if(x.correct&&!x.guessed&&(x.hint_level||0)===0)streak++;else break;
  }
  return streak>=2?Math.min(4,Math.max(2,d+1)):Math.max(2,d);
}
function recentWeakSuperDomains(){
  const s={algebra:0,geometry:0,number_theory:0,combinatorics:0,misc:0};
  for(const a of (S.attempts||[])){
    const age=dd(a.date,today());if(age<0||age>28)continue;
    const q=qById(a.question_id);if(!q)continue;
    if(!a.correct||a.guessed||a.error_type)s[superDomain(q)]+=(1/(1+age/7))*(a.correct?.5:1.5);
  }
  return s;
}
function authenticScore(q,targetProblem,used,mode){
  let s=0;
  // 正式题号是主要难度信号。差1题号就有明显代价，避免Q9和Q16被粗略视为同难度。
  s-=Math.abs((q.problem_number||15)-targetProblem)*1.7;
  const ageA=lastAttemptForQuestion(q.id);if(ageA)s-=Math.max(0,30-daysSinceAttempt(ageA));
  const weak=recentWeakSuperDomains();s+=(weak[superDomain(q)]||0)*(mode==='weak'?2.2:.6);
  const D=domainFreq();s-=(D[q.domain]||0)*(mode==='coverage'?1.4:.25);
  if(used.some(x=>x.year===q.year))s-=.35;
  if(used.some(x=>superDomain(x)===superDomain(q)))s-=mode==='coverage'?2.2:.4;
  s+=stableNoise(`${mode}:${q.id}`)*.35;
  return s;
}
function generateDailyPlan(){
  const pool=eligibleDailyBank();
  if(pool.length<3)return [];
  const used=[];
  const weakMap=recentWeakSuperDomains();
  const weakDomain=Object.entries(weakMap).sort((a,b)=>b[1]-a[1])[0]?.[0];

  // Slot 1：弱项迁移，目标中心约正式 Q16。
  let aPool=pool.filter(q=>q.problem_number>=13&&q.problem_number<=19);
  if(weakDomain&&weakMap[weakDomain]>0){const w=aPool.filter(q=>superDomain(q)===weakDomain);if(w.length)aPool=w;}
  let a=aPool.sort((x,y)=>authenticScore(y,16,used,'weak')-authenticScore(x,16,used,'weak'))[0]||pool[0];
  used.push(a);

  // Slot 2：到期/历史复测，目标中心约 Q17。
  let dueCandidates=pool.filter(q=>q.problem_number>=14&&q.problem_number<=21&&!used.some(x=>x.id===q.id)&&S.skill_state?.[skillKey(q)]?.next_review<=today());
  let bPool=dueCandidates.length?dueCandidates:pool.filter(q=>q.problem_number>=14&&q.problem_number<=21&&!used.some(x=>x.id===q.id)&&superDomain(q)!==superDomain(a));
  let b=bPool.sort((x,y)=>authenticScore(y,17,used,'due')-authenticScore(x,17,used,'due'))[0];
  if(b)used.push(b);

  // Slot 3：广度/陌生题，平日中心 Q20；周五中心 Q23。
  const dow=new Date().getDay(),targetPos=dow===5?23:20;
  let cPool=pool.filter(q=>!used.some(x=>x.id===q.id)&&q.problem_number>=17&&!used.some(x=>superDomain(x)===superDomain(q)));
  if(dow===5){const hard=cPool.filter(q=>q.problem_number>=22);if(hard.length)cPool=hard;}
  else {const midhard=cPool.filter(q=>q.problem_number>=18&&q.problem_number<=22);if(midhard.length)cPool=midhard;}
  let c=cPool.sort((x,y)=>authenticScore(y,targetPos,used,'coverage')-authenticScore(x,targetPos,used,'coverage'))[0];
  if(c)used.push(c);
  return used.slice(0,3);
}
function dailyReason(q,i){

  if(i===0)return `近期弱项迁移 · ${pos} · 真实AMC8`;
  if(i===1)return `到期/历史复测 · ${pos} · 真实AMC8`;
  return `广度/陌生题型 · ${pos} · 真实AMC8中后段难度`;
}

function buildPrintableMockCore(){
  if(REAL_BANK.length!==100){alert(authenticLoadState.message||'真实AMC8题库尚未加载完成。');return}
  const blocked=recentWeekendQuestionIds(3); // 4个年份可轮换，保证至少连续3套同题号不复用
  const chosen=[],domainRuns=[];
  for(let num=1;num<=25;num++){
    let pool=REAL_BANK.filter(q=>q.problem_number===num&&!blocked.has(q.id));
    if(!pool.length)pool=REAL_BANK.filter(q=>q.problem_number===num);
    if(chosen.length>=2){
      const s1=superDomain(chosen.at(-1)),s2=superDomain(chosen.at(-2));
      if(s1===s2){
        const alt=pool.filter(q=>superDomain(q)!==s1);if(alt.length)pool=alt;
      }
    }
    pool.sort((a,b)=>{
      const ay=chosen.filter(x=>x.year===a.year).length,by=chosen.filter(x=>x.year===b.year).length;
      const ad=chosen.filter(x=>superDomain(x)===superDomain(a)).length,bd=chosen.filter(x=>superDomain(x)===superDomain(b)).length;
      return (ay*1.2+ad*.2+stableNoise('mock:'+a.id)*.1)-(by*1.2+bd*.2+stableNoise('mock:'+b.id)*.1);
    });
    const q=pool[0];if(!q){alert(`真实题库中缺少Q${num}`);return}
    chosen.push(q);
  }
  S.printable_mock_ids=chosen.map(q=>q.id);
  S.printable_mock_date=today();
  S.printable_mock_meta={
    engine:'authentic_position_match_v063',engine_version:ENGINE_VERSION,
    source_years:[...new Set(chosen.map(q=>q.year))],
    note:'每个位置从2015–2018真实AMC8同题号位置抽取；保持真实Q1–25难度曲线。'

  S.printable_mock_id=null;
  saveStateLocal();

}

}
function generateSyncCode(){
  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return Array.from(bytes,b=>alphabet[b%alphabet.length]).join('');
}
function cloudHeaders(extra={}){
  return {'apikey':CLOUD_CFG.publishableKey,'Content-Type':'application/json',...extra};
}
async function cloudRequest(action,body={}){
  if(!cloudConfigured())throw new Error('云端尚未配置。');
  const code=normalizeSyncCode(body.sync_code||getSyncCode());
  if(code.length<20)throw new Error('同步码无效。');
  const r=await fetch(`${CLOUD_CFG.url}/functions/v1/amc8-sync`,{
    method:'POST',headers:cloudHeaders(),body:JSON.stringify({action,sync_code:code,...body,sync_code:code})
  });
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){
    const err=new Error(d.error==='revision_conflict'?'云端版本已变化，已停止覆盖。请先处理同步冲突。':(d.error||d.message||`云同步失败 ${r.status}`));
    err.status=r.status;err.data=d;throw err;
  }
  return d;
}
async function cloudFetchRow(code=getSyncCode()){
  return await cloudRequest('pull',{sync_code:code});
}
async function createNewSyncCode(){
  if(getSyncCode()&&!confirm('本机已经绑定同步码。确定要生成一把新的云端钥匙吗？原云端数据不会删除。'))return;
  const code=generateSyncCode();
  setSyncCode(code);
  S.cloud_meta={...(S.cloud_meta||{}),cloud_revision:0,last_sync_at:null,last_cloud_updated_at:null,sync_conflict:false};
  saveStateLocal(false);
  try{
    await cloudPushLocal(true);
    renderData();
    alert(`新的同步码已生成并已上传当前数据。\n\n${formatSyncCode(code)}\n\n请把它妥善保存；其他设备用同一同步码即可同步。`);
  }catch(e){setSyncCode('');throw e}
}
async function bindSyncCode(){
  const input=document.getElementById('cloud_sync_code'),code=normalizeSyncCode(input?.value||'');
  if(code.length<20){alert('请输入完整同步码。');return}
  const row=await cloudFetchRow(code);
  if(!row.exists){alert('没有找到这个同步码对应的云端数据，请核对后再试。');return}
  if(!confirm('绑定后将用云端训练数据覆盖当前浏览器里的数据。确定继续？'))return;
  setSyncCode(code);
  S=migrateState(row.payload);
  S.cloud_meta=S.cloud_meta||{};
  S.cloud_meta.cloud_revision=Number(row.revision||0);
  S.cloud_meta.last_cloud_updated_at=row.updated_at||null;
  S.cloud_meta.last_sync_at=new Date().toISOString();
  S.cloud_meta.local_modified_at=S.cloud_meta.last_sync_at;
  S.cloud_meta.sync_conflict=false;
  saveStateLocal(false);renderAll();alert('同步码已绑定，并已下载云端训练数据。');
}
function clearSyncCode(){
  if(!getSyncCode())return;
  if(!confirm('只解除这台设备的云端绑定。云端数据不会删除。确定继续？'))return;
  setSyncCode('');
  S.cloud_meta=S.cloud_meta||{};S.cloud_meta.cloud_revision=0;S.cloud_meta.last_cloud_updated_at=null;S.cloud_meta.last_sync_at=null;S.cloud_meta.sync_conflict=false;
  saveStateLocal(false);renderData();
}
async function copySyncCode(){
  const code=formatSyncCode(getSyncCode());if(!code)return;
  try{await navigator.clipboard.writeText(code);alert('同步码已复制。')}
  catch(e){prompt('复制下面的同步码：',code)}
}
async function cloudPushLocal(force=false){
  const code=getSyncCode();if(!code){alert('请先生成或绑定同步码。');return}
  const payload=structuredClone(S);payload.version=ENGINE_VERSION;
  const baseRevision=Number(S.cloud_meta?.cloud_revision||0);
  try{
    const row=await cloudRequest('push',{payload,base_revision:baseRevision,force});
    S.cloud_meta=S.cloud_meta||{};
    S.cloud_meta.cloud_revision=Number(row.revision||baseRevision+1);
    S.cloud_meta.last_cloud_updated_at=row.updated_at||null;
    S.cloud_meta.last_sync_at=new Date().toISOString();
    S.cloud_meta.local_modified_at=S.cloud_meta.last_sync_at;
    S.cloud_meta.sync_conflict=false;
    saveStateLocal(false);renderData();return row;
  }catch(e){
    if(e.status===409){S.cloud_meta=S.cloud_meta||{};S.cloud_meta.sync_conflict=true;saveStateLocal(false);renderData()}
    throw e;
  }
}
async function cloudPullRemote(confirmOverwrite=true){
  const code=getSyncCode();if(!code){alert('请先生成或绑定同步码。');return}
  const row=await cloudFetchRow(code);if(!row.exists){alert('云端还没有训练数据。');return}
  if(confirmOverwrite&&!confirm('下载云端数据会覆盖当前浏览器里的训练数据。确定继续？'))return;
  S=migrateState(row.payload);
  S.cloud_meta=S.cloud_meta||{};
  S.cloud_meta.cloud_revision=Number(row.revision||0);
  S.cloud_meta.last_cloud_updated_at=row.updated_at||null;
  S.cloud_meta.last_sync_at=new Date().toISOString();
  S.cloud_meta.local_modified_at=S.cloud_meta.last_sync_at;
  S.cloud_meta.sync_conflict=false;
  saveStateLocal(false);renderAll();
  if(confirmOverwrite)alert('已从云端恢复训练数据。');
}
async function cloudSyncAuto(){
  if(!cloudConfigured()||!getSyncCode())return;
  const row=await cloudFetchRow();
  if(!row.exists){await cloudPushLocal(true);return}
  S.cloud_meta=S.cloud_meta||{};
  const knownRevision=Number(S.cloud_meta.cloud_revision||0),remoteRevision=Number(row.revision||0);
  const lastSync=S.cloud_meta.last_sync_at||null,localModified=S.cloud_meta.local_modified_at||null;
  const localChanged=!lastSync||(localModified&&localModified>lastSync);
  const cloudChanged=remoteRevision!==knownRevision;
  if(cloudChanged&&localChanged&&knownRevision>0){
    S.cloud_meta.sync_conflict=true;saveStateLocal(false);renderData();return;
  }
  if(cloudChanged){await cloudPullRemote(false);return}
  if(localChanged)await cloudPushLocal(false);
}
function scheduleCloudPush(){
  if(!cloudConfigured()||!getSyncCode())return;
  clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSyncAuto().catch(e=>console.warn('cloud sync',e)),1200);
}
function saveStateLocal(markModified=true){
  S.version=ENGINE_VERSION;S.cloud_meta=S.cloud_meta||{};
  if(markModified)S.cloud_meta.local_modified_at=new Date().toISOString();
  localStorage.setItem(LS,JSON.stringify(S));
  if(markModified)scheduleCloudPush();
}
function save(){saveStateLocal();renderAll()}
